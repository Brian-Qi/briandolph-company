# 公司站（独立域名/子域）Nginx 示例
# 与个人站 /var/www/briandolph 完全分开，不覆盖个人站和 ARG。

server {
    listen 80;
    server_name company.briandolph.xyz;   # 改成实际公司站域名/子域
    root /var/www/briandolph-company;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 证书：
# certbot --nginx -d company.briandolph.xyz
