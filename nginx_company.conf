# 公司站（独立域名/子域）Nginx 示例
# 生产根域配置以 deploy/nginx/briandolph.conf 为准；本文件仅保留子域示意。
# 该示例使用真实 404：需要先构建出各路由目录，否则 SPA 深链会 404。

server {
    listen 80;
    server_name company.briandolph.xyz;   # 改成实际公司站域名/子域
    root /var/www/briandolph-company;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# 证书：
# certbot --nginx -d company.briandolph.xyz