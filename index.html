    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var light = stored ? stored === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
          if (light) document.documentElement.setAttribute('data-theme', 'light');
          else document.documentElement.removeAttribute('data-theme');
        } catch (e) {}
      })();
    </script>
    <style>
      #biyu-splash-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #08080d;
        transition: opacity 0.45s ease;
      }
      .biyu-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .biyu-loader-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
        opacity: 0.92;
        filter: drop-shadow(0 0 14px rgba(255, 60, 60, 0.35));
        animation: biyuPulse 1.8s ease-in-out infinite;
      }
      .biyu-loader-line {
        width: 180px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .biyu-loader-line span {
        display: block;
        width: 42%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #ff4d4d, transparent);
        animation: biyuSweep 1.4s ease-in-out infinite;
      }
      .biyu-loader-text {
        color: rgba(255, 255, 255, 0.42);
        font: 500 11px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
      }
      @keyframes biyuPulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes biyuSweep {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
    <script>
      (function () {
        var KEY = 'biyu_splash_seen';
        var force = false;
        try {
          force = new URLSearchParams(location.search).has('splash');
        } catch (e) {}
        var seen = false;
        try {
          seen = sessionStorage.getItem(KEY) === '1';
        } catch (e) {}

        var boot = null;
        var dismissed = false;
        function dismissBoot() {
          if (dismissed) return;
          boot = boot || document.getElementById('biyu-splash-boot');
          if (!boot) return;
          dismissed = true;
          boot.style.opacity = '0';
          window.setTimeout(function () {
            if (boot) boot.remove();
          }, 470);
        }

        function whenSiteReady(cb) {
          if (document.readyState === 'complete') {
            window.setTimeout(cb, 260);
            return;
          }
          var done = false;
          function go() {
            if (done) return;
            done = true;
            window.setTimeout(cb, 260);
          }
          window.addEventListener('load', go, { once: true });
          window.setTimeout(go, 12000);
        }

        function addScript(src, onload, onerror) {
          var el = document.createElement('script');
          el.src = src;
          el.defer = true;
          if (onload) el.onload = onload;
          if (onerror) el.onerror = onerror;
          document.head.appendChild(el);
          return el;
        }

        var coarse = false;
        var reduce = false;
        try {
          coarse = window.matchMedia('(pointer: coarse)').matches;
          reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        } catch (e) {}
        // 手机上播开屏要多下 vendor.js(218KB) + splash.js(164KB)，
        // 在移动网络上就是首屏卡住；触屏直接跳过（?splash 仍可强制看）。
        var needSplash = (force || !seen) && !coarse;
        // 自定义光标（含其依赖的 React vendor）在触屏 / 减动效环境下没有意义，
        // 整条 splash 资源链都不必下载。
        var needCursor = !coarse && !reduce;

        if (!needSplash && !needCursor) {
          whenSiteReady(dismissBoot);
          // 触屏（或减动效）设备：开屏和光标都不加载，但首页的地形线背景还得要。
          // 等首屏彻底空闲后再补拉 vendor + topography，不阻塞首屏、也不参与开屏时序。
          var idle = window.requestIdleCallback || function (cb) { return window.setTimeout(cb, 1500); };
          idle(
            function () {
              if (!document.querySelector('[data-topography]')) return;
              if (document.querySelector('.hero-bg canvas')) return;
              addScript(
                '/splash/vendor.js',
                function () { addScript('/splash/topography.js', null, function () {}); },
                function () {}
              );
            },
            { timeout: 4000 }
          );
        } else {
          addScript(
            '/splash/vendor.js',
            function () {
              if (needCursor) addScript('/splash/cursor.js', null, function () {});
              if (needSplash) {
                addScript('/splash/splash.js', null, dismissBoot);
              } else {
                whenSiteReady(dismissBoot);
              }
            },
            dismissBoot
          );
        }

        window.setTimeout(dismissBoot, 15000);
      })();
    </script>
