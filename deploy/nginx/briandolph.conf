# 生产站点 Nginx 配置（脱敏副本，2026-11-15）
# 线上实际文件：/etc/nginx/conf.d/briandolph.conf
# 本文件不含服务器 IP、密钥或证书私钥内容。

server {
    server_name  briandolph.xyz www.briandolph.xyz;

    root   /var/www/briandolph;
    index  index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json text/xml text/plain image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # 留言墙 API 反代（必须放在 SPA 回退之前）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 静态回退：前端路由不匹配时回退到 index.html
    # 子项目：ARG (arg_01)
    location /arg_01/ {
        try_files $uri $uri/ /arg_01/index.html;
    }

    location /self/ {
        try_files $uri $uri/ /self/index.html;
    }

    # 隐藏文件/目录（.env/.git 等）一律 404，不进 SPA 回退
    location ~ /\.(?!well-known) {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # splash 资源不缓存，确保开屏/光标更新即时生效
    location ^~ /splash/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # HTML 不缓存（确保更新即时生效；保留 bfcache，不发送 no-store）
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex" always;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/briandolph.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/briandolph.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    listen       80;
    listen       [::]:80;
    server_name  briandolph.xyz www.briandolph.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
